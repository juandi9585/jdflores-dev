    <meta name="theme-color" content="#0A0C10" />
    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong world. An explicit choice wins; otherwise the OS decides.
      (function () {
        try {
          var stored = localStorage.getItem('jdf-theme');
          var t = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.dataset.theme = t;
          if (t === 'light') {
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#CFE4F5');
          }
        } catch (e) {
          document.documentElement.dataset.theme = 'dark';
        }
      })();
    </script>
