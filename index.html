    <script>
      // Resolve the theme before first paint so the page never flashes the
      // wrong world. An explicit choice wins; otherwise the OS decides.
      (function () {
        var t = 'dark';
        try {
          var stored = localStorage.getItem('jdf-theme');
          t = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
        } catch (e) {}
        document.documentElement.dataset.theme = t;
        if (t === 'light') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#CFE4F5');
        }
        // Fetch this world's two faces before the stylesheet asks for them;
        // the other world's never download. Relative, so both the Pages
        // sub-path and the dev root resolve.
        var faces = t === 'light'
          ? ['neuropol.woff2', 'source-sans-3-latin.woff2']
          : ['michroma-latin.woff2', 'saira-latin.woff2'];
        for (var i = 0; i < faces.length; i++) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'font';
          l.type = 'font/woff2';
          l.crossOrigin = 'anonymous';
          l.href = 'fonts/' + faces[i];
          document.head.appendChild(l);
        }
      })();
    </script>
